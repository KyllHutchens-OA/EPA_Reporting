{% extends 'base.html' %}
{% block content %}
  <div class="bg-card rounded-lg shadow p-6 mb-8">
    <h2 class="text-xl font-semibold mb-4">Edit Data</h2>
    <form method="post" class="grid grid-cols-1 md:grid-cols-3 gap-6">
      <div>
        <label class="block text-gray-700 mb-2">Select Site</label>
        <select name="site_id" required
                class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:ring-2 focus:ring-blue-600">
          <option value="">Select Site</option>
          {% for s in sites %}
            <option value="{{ s.samplingpoint_id }}">{{ s.report_name }}</option>
          {% endfor %}
        </select>
      </div>
      <div>
        <label class="block text-gray-700 mb-2">Data Key</label>
        <input type="text" name="key" required
               class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:ring-2 focus:ring-blue-600">
      </div>
      <div>
        <label class="block text-gray-700 mb-2">Value</label>
        <input type="text" name="value"
               class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:ring-2 focus:ring-blue-600">
      </div>
      <div class="md:col-span-3 text-right">
        <button type="submit" class="bg-blue-600 text-white px-6 py-2 rounded-lg hover:bg-blue-700 transition">
          Add Entry
        </button>
      </div>
    </form>
  </div>
  <div class="bg-card rounded-lg shadow p-6">
    <h2 class="text-xl font-semibold mb-4">Recent Entries</h2>
    <div class="overflow-x-auto">
      <table class="min-w-full text-left">
        <thead class="bg-bg">
          <tr>
            <th class="px-4 py-2 font-medium">Site</th>
            <th class="px-4 py-2 font-medium">Key</th>
            <th class="px-4 py-2 font-medium">Value</th>
          </tr>
        </thead>
        <tbody>
          {% for e in entries %}
            <tr class="hover:bg-gray-50">
              <td class="border-t px-4 py-2">{{ e.site }}</td>
              <td class="border-t px-4 py-2">{{ e.key }}</td>
              <td class="border-t px-4 py-2">{{ e.value }}</td>
            </tr>
          {% endfor %}
        </tbody>
      </table>
    </div>
  </div>
{% endblock %}
