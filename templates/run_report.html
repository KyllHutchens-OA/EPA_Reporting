{% extends 'base.html' %}
{% block content %}
  <div class="bg-card rounded-lg shadow p-6 mb-8">
    <h2 class="text-xl font-semibold mb-4">Run Report</h2>

    <form method="post" id="run-report-form" class="space-y-6">
      <fieldset class="space-y-2">
        <legend class="block text-gray-700 font-medium">Run For</legend>
        <div class="flex items-center gap-6">
          <label class="flex items-center gap-2">
            <input type="radio" name="scope" value="all" checked
                   class="h-4 w-4 text-blue-600 focus:ring-blue-600">
            <span>All Sites</span>
          </label>
          <label class="flex items-center gap-2">
            <input type="radio" name="scope" value="single"
                   class="h-4 w-4 text-blue-600 focus:ring-blue-600">
            <span>Single Site</span>
          </label>
        </div>
      </fieldset>

      <div id="site-select-group">
        <label class="block text-gray-700 mb-2">Select Site</label>
        <select name="site_id"
                class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:ring-2 focus:ring-blue-600">
          <option value="">Select Site</option>
          {% for s in sites %}
            <option value="{{ s.report_name }}">{{ s.report_name }}</option>
          {% endfor %}
        </select>
      </div>

      <div>
        <label class="block text-gray-700 mb-2">Reporting Year Start Date</label>
        <input type="date" name="start_date" required
               class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:ring-2 focus:ring-blue-600">
      </div>
      <div>
        <label class="block text-gray-700 mb-2">Reporting Year End Date</label>
        <input type="date" name="end_date" required
               class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:ring-2 focus:ring-blue-600">
      </div>

      <div class="text-right">
        <button type="submit"
                class="bg-green-600 text-white px-6 py-2 rounded-lg hover:bg-green-700 transition">
          Generate Report
        </button>
      </div>
    </form>

    <div id="progress-spinner" class="mt-6 hidden">
      <div class="flex items-center space-x-2">
        <svg class="animate-spin h-5 w-5 text-green-600"
             xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
          <circle class="opacity-25" cx="12" cy="12" r="10"
                  stroke="currentColor" stroke-width="4"/>
          <path class="opacity-75" fill="currentColor"
                d="M4 12a8 8 0 018-8v4a4 4 0 00-4 4H4z"/>
        </svg>
        <span class="text-green-600 font-medium">Generating Report...</span>
      </div>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', function() {
      const form          = document.getElementById('run-report-form');
      const spinner       = document.getElementById('progress-spinner');
      const flashContainer= document.querySelector('.flash-messages');
      const siteGroup     = document.getElementById('site-select-group');
      const radios        = document.querySelectorAll('input[name="scope"]');

      function toggleSiteSelect() {
        const single = document.querySelector('input[name="scope"]:checked').value === 'single';
        siteGroup.style.display = single ? 'block' : 'none';
      }

      radios.forEach(r => r.addEventListener('change', toggleSiteSelect));
      toggleSiteSelect();

      form.addEventListener('submit', function() {
        if (flashContainer) flashContainer.innerHTML = '';
        if (spinner) spinner.classList.remove('hidden');
      });

      // ensure spinner hidden on page load
      if (spinner) spinner.classList.add('hidden');
    });
  </script>
{% endblock %}
